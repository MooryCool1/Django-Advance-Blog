<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تماس با ما</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
            background: #f7f7f9;
            color: #333;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-box {
            background: #fff;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }

        .form-box p {
            margin-bottom: 15px;
        }

        .form-box label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #555;
        }

        .form-box input,
        .form-box textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-family: inherit;
            font-size: 14px;
            box-sizing: border-box;
        }

        .form-box input[type="submit"] {
            width: auto;
            background: #4a6cf7;
            color: #fff;
            border: none;
            padding: 10px 24px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        .form-box input[type="submit"]:hover {
            background: #3a56c5;
        }
    </style>
</head>
<body>
    <h1>تماس با ما</h1>

    <div class="form-box">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <input type="submit" value="Send message">
        </form>
    </div>
</body>
</html>
